name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore tests/xq-tests.csproj

      - name: Check formatting
        run: dotnet format xq.csproj --verify-no-changes --verbosity diagnostic

      - name: Test
        run: dotnet test tests/xq-tests.csproj -c Release --no-restore
             --logger "trx;LogFileName=results.trx"
             --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore

  build:
    name: build (win-x64)
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: >
          dotnet publish xq.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xq-win-x64
          path: dist/xq.exe
          if-no-files-found: error
